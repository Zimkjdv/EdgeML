server {
  listen 80;
  server_name _;
  # Above default backend limits: 5 MiB CSV + multipart overhead / 10 MiB JSON.
  client_max_body_size ${EDGEML_PROXY_MAX_BODY_SIZE};
  client_body_timeout ${EDGEML_PROXY_SEND_TIMEOUT};

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_connect_timeout 10s;
    proxy_send_timeout ${EDGEML_PROXY_SEND_TIMEOUT};
    proxy_read_timeout ${EDGEML_PROXY_READ_TIMEOUT};
  }
}

