; Non-secret settings shared by both Python prediction examples.
; Priority: CLI > existing environment variables > INI > built-in defaults.
; NEVER put an API token or a DB password here.
; Client credentials belong in the Git-ignored .env.local next to this file.
; For private settings, copy to piapifd_prediction.local.ini (Git-ignored)
; and pass --config examples/piapifd_prediction.local.ini.

[api]
; Full Docker: 8010. Local API: 8000 (the BAT passes this explicitly).
url = http://127.0.0.1:8010/api
model_id = 67f88ae0-ad99-4f5c-b099-16a9c8059756
timeout = 60

[mysql]
host = 127.0.0.1
port = 3306
; Use a restricted service account for deployment instead of root.
user = root
connect_timeout = 10
read_timeout = 60
write_timeout = 60

[source]
; Read-only source. Source and target must be different databases.
database = piapi_fd
table = pidata1_merged
mapping_table = pidata1_mapping

[target]
database = piapifd_edge
table = pidata1_predict

[prediction]
batch_size = 200
; Empty limit means ALL matching source rows, processed in batches.
limit =
; Paths in INI are relative to THIS INI's directory, not the working directory.
feature_aliases = piapifd_feature_aliases.json
; Mode, table creation and time bounds remain explicit CLI options for safety.
