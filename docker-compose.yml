services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      EDGEML_MODELS_ROOT: /app/ml_models
      EDGEML_TRAINED_MODELS_ROOT: /app/data/trained_models
      EDGEML_TRAINING_JOBS_ROOT: /app/data/training_jobs
      EDGEML_PREDICTION_HISTORY_FILE: /app/data/prediction_history.jsonl
      EDGEML_QUEUE_BACKEND: redis
      EDGEML_REDIS_URL: redis://redis:6379/0
      EDGEML_MAX_UPLOAD_BYTES: "5242880"
    volumes:
      - prediction-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.training_worker"]
    environment:
      EDGEML_MODELS_ROOT: /app/ml_models
      EDGEML_TRAINED_MODELS_ROOT: /app/data/trained_models
      EDGEML_TRAINING_JOBS_ROOT: /app/data/training_jobs
      EDGEML_PREDICTION_HISTORY_FILE: /app/data/prediction_history.jsonl
      EDGEML_QUEUE_BACKEND: redis
      EDGEML_REDIS_URL: redis://redis:6379/0
      EDGEML_MAX_UPLOAD_BYTES: "5242880"
    volumes:
      - prediction-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5180:80"

volumes:
  prediction-data:
