services:
  backend:
    build:
      context: ./backend
    environment:
      EDGEML_MODELS_ROOT: /app/ml_models
      EDGEML_PREDICTION_HISTORY_FILE: /app/data/prediction_history.jsonl
      EDGEML_MAX_UPLOAD_BYTES: "5242880"
    volumes:
      - prediction-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  prediction-data:

