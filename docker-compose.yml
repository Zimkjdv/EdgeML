services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      EDGEML_MODELS_ROOT: /app/data/published_models
      EDGEML_BUNDLED_MODELS_ROOT: /app/ml_models
      EDGEML_TRAINED_MODELS_ROOT: /app/data/trained_models
      EDGEML_TRAINING_JOBS_ROOT: /app/data/training_jobs
      EDGEML_PREDICTION_HISTORY_FILE: /app/data/prediction_history.jsonl
      EDGEML_QUEUE_BACKEND: redis
      EDGEML_REDIS_URL: redis://redis:6379/0
      EDGEML_MAX_UPLOAD_BYTES: "5242880"
      EDGEML_MAX_JSON_BODY_BYTES: "10485760"
      EDGEML_API_TOKEN: ${EDGEML_API_TOKEN:-}
      EDGEML_WEB_USERNAME: ${EDGEML_WEB_USERNAME:-admin}
      EDGEML_WEB_PASSWORD: ${EDGEML_WEB_PASSWORD:-}
      EDGEML_WEB_COOKIE_SECURE: ${EDGEML_WEB_COOKIE_SECURE:-false}
      EDGEML_WEB_ALLOWED_ORIGINS: '${EDGEML_WEB_ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:5180"]}'
    volumes:
      - prediction-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.training_worker"]
    restart: unless-stopped
    environment:
      EDGEML_MODELS_ROOT: /app/data/published_models
      EDGEML_BUNDLED_MODELS_ROOT: /app/ml_models
      EDGEML_TRAINED_MODELS_ROOT: /app/data/trained_models
      EDGEML_TRAINING_JOBS_ROOT: /app/data/training_jobs
      EDGEML_PREDICTION_HISTORY_FILE: /app/data/prediction_history.jsonl
      EDGEML_QUEUE_BACKEND: redis
      EDGEML_REDIS_URL: redis://redis:6379/0
      EDGEML_MAX_UPLOAD_BYTES: "5242880"
    volumes:
      - prediction-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5180:80"

volumes:
  prediction-data:
  redis-data:
